<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta-Booth 主控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 主控台：16:9 大螢幕全畫面，3D 舞台 + 相框疊層 + 角落 HUD；刻意只做深色（棚內螢幕） */
:root {
  --ink: #f4f2fa; --muted: #aaa5bf; --accent: #ff4f7b; --pop: #ffd23f;
  --panel: rgba(18, 16, 28, .78); --line: rgba(255, 255, 255, .16); --bg: #0f0e16;
  --f-display: "Rubik Mono One", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
[hidden] { display: none !important; }
#gl, #frame { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { image-rendering: pixelated; filter: var(--grade); }
:root { --grade: contrast(1.08) saturate(.9) sepia(.08); }
.drop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(15,14,22,.85); border: 4px dashed var(--pop); font-size: 28px; font-weight: 900; }
#frame { pointer-events: none; }

.status { position: fixed; bottom: 46px; left: 18px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 4; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: flex; gap: 7px; align-items: center; backdrop-filter: blur(6px); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.ok i { background: #3ee08f; } .pill.warn i { background: var(--pop); } .pill.bad i { background: var(--accent); }
.pill.mono { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.camwrap { position: fixed; right: 18px; bottom: 64px; width: 260px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; z-index: 4; }
.camwrap video, .camwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.camwrap.big { position: relative; right: auto; bottom: auto; width: min(560px, 80vw); border: 2px solid var(--ink); }
.scanbox { position: absolute; inset: 14% 30%; border: 3px solid var(--pop); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scanbox::after { content: ""; position: absolute; left: 6%; right: 6%; height: 2px; background: var(--pop); top: 10%; animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { to { top: 88%; } }
.camwrap:not(.big) .scanbox { display: none; }

#idle { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; background: radial-gradient(ellipse at center, rgba(15,14,22,.35), rgba(15,14,22,.85)); }
.idle-in { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
.idle-in h1 { margin: 0; font-size: clamp(28px, 4.2vw, 60px); font-weight: 900; text-wrap: balance; }
.idle-in .eyebrow { font-family: var(--f-display); font-size: 14px; letter-spacing: .1em; color: var(--pop); }
.idle-in p { margin: 0; color: var(--muted); font-size: 17px; }
.camhelp { max-width: 560px; background: #2a1520; border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.camhelp b { font-size: 18px; color: var(--accent); }
.camhelp span { color: var(--ink); font-size: 15px; line-height: 1.6; }
.camhelp .btn { align-self: flex-start; }
.idle-in:has(.camhelp:not([hidden])) .camwrap.big { width: min(380px, 70vw); }
.idle-in:has(.camhelp:not([hidden])) { gap: 12px; }
.idle-in kbd { font-family: var(--f-mono); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--ink); }

#count { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; }
#count span { font-family: var(--f-display); font-size: 34vh; color: var(--pop); -webkit-text-stroke: 6px #1d1b2a; animation: pop .9s ease-out both; }
@keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { transform: scale(1); opacity: 1; } to { opacity: .85; } }
#flash { position: fixed; inset: 0; background: #fff; z-index: 7; opacity: 0; pointer-events: none; transition: opacity .5s ease-out; }
#flash.on { opacity: 1; transition: none; }

.modal { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(10,9,16,.7); padding: 24px; }
.card { background: #1b1926; border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: min(900px, 92vw); }
.card img { max-width: 100%; max-height: 62vh; border-radius: 10px; border: 3px solid #fff; transform: rotate(-1.5deg); }
.card h2 { margin: 0; font-size: 26px; font-weight: 900; }
.card p { margin: 0; color: var(--muted); }
.card label { align-self: stretch; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.card input { font: inherit; font-size: 20px; font-family: var(--f-mono); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f0e16; color: var(--ink); width: min(420px, 80vw); }
.row { display: flex; gap: 10px; }
.btn { font: inherit; font-weight: 900; font-size: 16px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.err { color: var(--accent); font-size: 14px; font-weight: 700; }

.keys { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 10px 18px; font-size: 13px; color: var(--muted); background: linear-gradient(transparent, rgba(10,9,16,.8)); }
.keys kbd { font-family: var(--f-mono); color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-right: 4px; }
.toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 9; background: var(--pop); color: #1d1b2a; font-weight: 900; padding: 8px 18px; border-radius: 999px; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .scanbox::after, #count span { animation: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="frame"></canvas>

<div class="status">
  <span class="pill warn" id="stCam"><i></i>鏡頭：啟動中</span>
  <span class="pill warn" id="stTrack"><i></i>動補：載入中</span>
  <span class="pill mono" id="stFps">-- fps</span>
</div>

<div id="idle">
  <div class="idle-in">
    <div class="eyebrow">META-BOOTH</div>
    <h1>把手機上的分身票對準鏡頭</h1>
    <div id="camSlotBig"></div>
    <div class="camhelp" id="camHelp" hidden>
      <b></b><span></span>
      <button class="btn primary" type="button" id="camRetry">重新偵測鏡頭</button>
    </div>
    <p>掃不到嗎？請工作人員按 <kbd>C</kbd> 輸入代碼</p>
  </div>
</div>

<div class="camwrap big" id="camwrap">
  <video id="video" playsinline muted></video>
  <canvas id="skel"></canvas>
  <div class="scanbox"></div>
</div>

<div id="count" hidden><span id="countNum">3</span></div>
<div id="flash"></div>

<div class="modal" id="shotModal" hidden>
  <div class="card">
    <img id="shotImg" alt="剛拍好的拍貼">
    <h2>拍好了！</h2>
    <p id="shotMsg">已存到這台電腦的下載資料夾</p>
  </div>
</div>

<div class="modal" id="manual" hidden>
  <form class="card" id="manualForm">
    <h2>手動輸入分身代碼</h2>
    <label for="codeInput">分身票上的代碼（例：Z48X · 000001144）
      <input id="codeInput" autocomplete="off" spellcheck="false">
    </label>
    <label for="nameInput2">名字（選填）
      <input id="nameInput2" autocomplete="off" maxlength="10">
    </label>
    <span class="err" id="codeErr" hidden>代碼格式不對，要有 9 碼數字或英文（前面的 4 碼編號可省略）</span>
    <div class="row"><button class="btn" type="button" id="manualCancel">取消</button><button class="btn primary" type="submit">載入分身</button></div>
  </form>
</div>

<div class="keys" id="keys">
  <span><kbd>空白</kbd><kbd>→</kbd>拍照（簡報筆）</span>
  <span>雙手舉高 1 秒也能拍照</span>
  <span><kbd>N</kbd>下一位</span>
  <span><kbd>B</kbd>換背景</span>
  <span><kbd>K</kbd>頭部校正</span>
  <span><kbd>V</kbd>換鏡頭</span>
  <span><kbd>D</kbd>鏡頭小窗</span>
  <span><kbd>C</kbd>輸入代碼</span>
  <span><kbd>P</kbd>像素顆粒</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="avatar-lib.js"></script>
<script>
(function () {
'use strict';
// ================= 設定 =================
const MP_VER = '0.10.14';
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HANDS_UP_SEC = 1.0;      // 雙手舉高多久觸發拍照
const COUNT_FROM = 3;
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');

// ================= 零件清單（必須和手機捏臉頁一致） =================
const HAIR = ['短髮', '雙馬尾', '刺蝟頭', '鮑伯頭', '丸子頭'];
const HAIR_COLORS = ['#2b2230', '#6b4a3a', '#d9a55b', '#e86a8e', '#6fa8dc', '#ecebe6'];
const SKIN = ['#fde3cf', '#f3c9a5', '#d9a07a', '#a8714f', '#6e4631'];
const EYES = ['圓眼', '笑眼', '睏睏眼', '星星眼'];
const MOUTH = ['微笑', '張嘴', '貓嘴'];
const BLUSH = ['不要', '要'];
const OUTFIT = ['T恤', '帽T', '洋裝', '制服'];
const OUTFIT_COLORS = ['#f2f2ee', '#ff5c7a', '#ffc93c', '#3ec7a6', '#4a7bf7', '#2e2a3a'];
const ACC = ['無', '眼鏡', '貓耳', '皇冠', '耳機', '光環'];
const KEYS = ['hair', 'hairColor', 'skin', 'eyes', 'mouth', 'blush', 'outfit', 'outfitColor', 'acc'];
const LISTS = { hair: HAIR, hairColor: HAIR_COLORS, skin: SKIN, eyes: EYES, mouth: MOUTH, blush: BLUSH, outfit: OUTFIT, outfitColor: OUTFIT_COLORS, acc: ACC };

// ================= 解碼 QR：MB1-參數9碼-編號4碼-名字base64url =================
function b64urlDecode(s) {
  if (!s) return '';
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function paramsToState(p) {
  if (!/^[0-9a-z]{9}$/.test(p)) return null;
  const S = {};
  for (let i = 0; i < KEYS.length; i++) {
    const v = parseInt(p[i], 36);
    if (!(v >= 0 && v < LISTS[KEYS[i]].length)) return null;
    S[KEYS[i]] = v;
  }
  return S;
}
function decodePayload(text) {
  const m = /^MB1-([0-9a-z]{9})-([A-Z0-9]{4})-([A-Za-z0-9_-]*)$/.exec((text || '').trim());
  if (!m) return null;
  const S = paramsToState(m[1]); if (!S) return null;
  try { S.name = b64urlDecode(m[3]); } catch (e) { S.name = ''; }
  S.id = m[2];
  return S;
}

// ================= 3D 場景 =================
const T = THREE, PI = Math.PI, DS = T.DoubleSide, DARK = '#2b2230';
const glCanvas = document.getElementById('gl');
const renderer = new T.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
let pixelScale = 3;   // 老引擎感：畫面先用 1/3 解析度算，再放大成像素
renderer.setPixelRatio(1 / pixelScale);
renderer.outputEncoding = T.sRGBEncoding;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(30, 16 / 9, 0.1, 60);
camera.position.set(0, 1.12, 5.6);
camera.lookAt(0, 1.0, 0);
scene.add(new T.HemisphereLight(0xfff4ea, 0x5a5670, 0.6));
const sun = new T.DirectionalLight(0xfff0dd, 1.05); sun.position.set(3, 4, 3); scene.add(sun);
const rimL = new T.DirectionalLight(0xffffff, 0.35); rimL.position.set(-3, 2, -3); scene.add(rimL);

const THEMES = [
  { name: '拍貼粉', top: '#ffb3c7', bottom: '#ffe3ec', dot: 'rgba(255,255,255,.55)', floor: '#ffffff', shapes: ['#ff4f7b', '#ffd23f', '#ffffff', '#8fd6ff'], frame: '#ff4f7b', rim: 0xffe2ec },
  { name: '夜市霓虹', top: '#140f2e', bottom: '#4a1655', dot: 'rgba(255,255,255,.12)', floor: '#ff4f7b', shapes: ['#ff4f7b', '#3ee0d0', '#ffd23f', '#8a6bff'], frame: '#3ee0d0', rim: 0x3ee0d0 },
  { name: '晴天草地', top: '#7cc6ff', bottom: '#e6fbff', dot: 'rgba(255,255,255,.35)', floor: '#7ad37a', shapes: ['#ffffff', '#ffd23f', '#ff8fa3', '#4a7bf7'], frame: '#ffd23f', rim: 0xffffff }
];
let themeIdx = 0;
const floor = new T.Mesh(new T.CircleGeometry(2.4, 7), new T.MeshLambertMaterial({ color: '#fff', transparent: true, opacity: 0.35 }));
floor.rotation.x = -PI / 2; floor.position.y = -0.01; scene.add(floor);
const shadow = new T.Mesh(new T.CircleGeometry(0.62, 24), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16 }));
shadow.rotation.x = -PI / 2; shadow.position.y = 0.003; scene.add(shadow);
const deco = new T.Group(); scene.add(deco);
(function makeDeco() {
  const geos = [new T.OctahedronGeometry(0.22), new T.IcosahedronGeometry(0.2, 0), new T.TetrahedronGeometry(0.25), new T.TorusGeometry(0.18, 0.06, 4, 10)];
  const spots = [[-3.2, 2.3, -3], [3.1, 2.0, -3.4], [-2.4, 0.6, -2.4], [2.6, 0.7, -2.2], [-4.2, 1.3, -4.5], [4.4, 1.6, -4.8], [-1.5, 2.8, -4], [1.6, 2.9, -4.2], [0, 3.3, -5], [-3.6, 3.1, -5.2]];
  spots.forEach((p, i) => {
    const me = new T.Mesh(geos[i % geos.length], new T.MeshLambertMaterial({ color: '#fff' }));
    me.position.set(p[0], p[1], p[2]); me.userData.spin = 0.2 + (i % 4) * 0.12; me.userData.phase = i;
    deco.add(me);
  });
})();
function bgTexture(th) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, th.top); g.addColorStop(1, th.bottom);
  x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  x.fillStyle = th.dot;
  for (let yy = 8; yy < 512; yy += 22) for (let xx = (yy / 22 % 2) * 11 + 8; xx < 512; xx += 22) { x.beginPath(); x.arc(xx, yy, 2.2, 0, PI * 2); x.fill(); }
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.magFilter = T.NearestFilter; return t;
}
function applyTheme() {
  const th = THEMES[themeIdx];
  if (scene.background && scene.background.dispose) scene.background.dispose();
  scene.background = bgTexture(th);
  floor.material.color.set(th.floor).convertSRGBToLinear();
  rimL.color.setHex(th.rim);
  deco.children.forEach((m, i) => m.material.color.set(th.shapes[i % th.shapes.length]).convertSRGBToLinear());
  drawOverlay();
}

// ================= 分身 Rig（造型與手機頁相同，但拆成可動的骨架） =================
let rig = null, current = null;
function buildRig(S) {
  const root = new T.Group(); root.userData.o = new T.Vector3();
  const skin = SKIN[S.skin], hc = HAIR_COLORS[S.hairColor], oc = OUTFIT_COLORS[S.outfitColor];
  function G(parent, x, y, z) {
    const g = new T.Group(); const po = parent.userData.o;
    g.userData.o = new T.Vector3(x, y, z); g.position.set(x - po.x, y - po.y, z - po.z);
    parent.add(g); return g;
  }
  function M(parent, geo, color, p, o) {
    o = o || {};
    const mat = new T.MeshStandardMaterial(Object.assign({ color, flatShading: true, roughness: 0.75, metalness: 0 }, o.mat || {}));
    const me = new T.Mesh(geo, mat); const po = parent.userData.o;
    me.position.set(p[0] - po.x, p[1] - po.y, p[2] - po.z);
    if (o.rot) me.rotation.set(o.rot[0], o.rot[1], o.rot[2]);
    if (o.scale) me.scale.set(o.scale[0], o.scale[1], o.scale[2]);
    parent.add(me); return me;
  }
  const HY = 1.5, outfit = S.outfit;
  const upper = G(root, 0, 0.38, 0);
  const head = G(upper, 0, 1.0, 0);

  // 腿、鞋（固定）
  const legColor = outfit === 2 ? skin : '#3a3346';
  [-1, 1].forEach(s => {
    M(root, new T.CylinderGeometry(0.13, 0.13, 0.36, 6), legColor, [s * 0.15, 0.22, 0]);
    M(root, new T.BoxGeometry(0.2, 0.1, 0.3), DARK, [s * 0.15, 0.05, 0.04]);
  });
  // 身體
  if (outfit === 2) {
    M(upper, new T.CylinderGeometry(0.3, 0.36, 0.46, 7), oc, [0, 0.78, 0]);
    M(root, new T.CylinderGeometry(0.34, 0.64, 0.46, 8), oc, [0, 0.42, 0]);
    M(upper, new T.TorusGeometry(0.335, 0.03, 4, 14), '#ffffff', [0, 0.62, 0], { rot: [PI / 2, 0, 0] });
  } else {
    M(upper, new T.CylinderGeometry(0.32, 0.42, 0.62, 7), oc, [0, 0.69, 0]);
  }
  // 手臂：以肩膀為軸心
  const arms = {};
  [-1, 1].forEach(s => {
    const sx = s * 0.376;
    const pivot = G(upper, sx, 0.95, 0);
    M(pivot, new T.CylinderGeometry(0.11, 0.095, 0.46, 6), oc, [sx, 0.72, 0]);
    M(pivot, new T.SphereGeometry(0.1, 7, 5), skin, [sx, 0.48, 0]);
    pivot.rotation.z = s * 0.42;
    arms[s] = pivot;
  });
  if (outfit === 0) {
    M(upper, new T.OctahedronGeometry(0.08), '#ffd23f', [0.13, 0.8, 0.36], { scale: [1, 1, 0.35] });
  } else if (outfit === 1) {
    M(upper, new T.TorusGeometry(0.27, 0.1, 5, 10), oc, [0, 1.0, -0.06], { rot: [PI / 2, 0, 0] });
    M(upper, new T.BoxGeometry(0.42, 0.15, 0.05), shade(oc, -0.12), [0, 0.55, 0.38], { rot: [-0.16, 0, 0] });
    [-1, 1].forEach(s => M(upper, new T.CylinderGeometry(0.012, 0.012, 0.2, 4), '#ffffff', [s * 0.08, 0.86, 0.35]));
  } else if (outfit === 3) {
    M(upper, new T.BoxGeometry(0.2, 0.42, 0.04), '#ffffff', [0, 0.78, 0.34], { rot: [-0.16, 0, 0] });
    M(upper, new T.BoxGeometry(0.07, 0.32, 0.03), '#d6304f', [0, 0.76, 0.37], { rot: [-0.16, 0, 0] });
  }

  // 頭
  M(head, new T.IcosahedronGeometry(0.62, 1), skin, [0, HY, 0], { scale: [1, 0.92, 0.95] });
  // 眼睛（各自一個群組，眨眼時縮放）
  const ey = HY - 0.02, ez = 0.53, eyes = {};
  [-1, 1].forEach(s => {
    const x = s * 0.22; const eg = G(head, x, ey, ez); eyes[s] = eg;
    if (S.eyes === 0) {
      M(eg, new T.SphereGeometry(0.08, 8, 6), DARK, [x, ey, ez], { scale: [1, 1.15, 0.5] });
      M(eg, new T.SphereGeometry(0.025, 6, 4), '#ffffff', [x + 0.025, ey + 0.035, ez + 0.045]);
    } else if (S.eyes === 1) {
      M(eg, new T.TorusGeometry(0.07, 0.022, 4, 10, PI), DARK, [x, ey - 0.03, ez + 0.01]);
    } else if (S.eyes === 2) {

// 角度限制（在骨頭父層的座標裡，向量預設往下 = 0,-1,0）
const LIMIT = {

  thigh: (v, s) => { v.z = clamp(v.z, -0.6, 1.2); if (s * v.x < -0.25) v.x = -0.25 * s; if (s * v.x > 0.8) v.x = 0.8 * s; },

// ================= 拍照 =================

}

  const W = frameCanvas.width, H = frameCanvas.height;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const c = out.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.filter = getComputedStyle(document.documentElement).getPropertyValue('--grade').trim() || 'none';
  c.drawImage(glCanvas, 0, 0, W, H);
  c.filter = 'none';
  c.drawImage(frameCanvas, 0, 0, W, H);
  const url = out.toDataURL('image/png');
  flash.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
  const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const fname = 'metabooth_' + (current.id || 'XXXX') + '_' + stamp + '.png';
  try { const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  document.getElementById('shotImg').src = url;
  document.getElementById('shotMsg').textContent = '已存到這台電腦的下載資料夾：' + fname;
  const modal = document.getElementById('shotModal'); modal.hidden = false;
  setTimeout(() => { modal.hidden = true; }, 3800);
  window.dispatchEvent(new CustomEvent('metabooth:photo', { detail: { dataURL: url, filename: fname, avatar: current } }));
}

// ================= 鏡頭 / QR 掃描 / MediaPipe =================
const video = document.getElementById('video'), skel = document.getElementById('skel'), sctx = skel.getContext('2d');
const scanCanvas = document.createElement('canvas'), scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
let cams = [], camIdx = 0, stream = null, pose = null, face = null, lastVT = -1, lastScan = 0;

const CAM_HELP = {
  insecure: ['這個網址不能使用鏡頭', '瀏覽器只允許 https、localhost 或直接開檔使用鏡頭。請用 VS Code 的 Live Server 開（網址要是 127.0.0.1 或 localhost），不要用區網 IP（192.168…），也不要在 Claude 的預覽視窗裡開。'],
  NotAllowedError: ['鏡頭權限被拒絕', '點網址列左邊的鎖頭／設定圖示 → 攝影機改成「允許」，再按下面的按鈕。Windows 另外要到「設定 → 隱私權與安全性 → 相機」打開「讓桌面應用程式存取相機」；Mac 到「系統設定 → 隱私權與安全性 → 相機」勾選 Chrome。'],
  NotFoundError: ['找不到鏡頭', '確認 Webcam 有插好（換一個 USB 孔試試），裝置管理員裡看得到它，再按下面的按鈕。'],
  NotReadableError: ['鏡頭被別的程式占用', '關掉正在用鏡頭的程式（OBS、Zoom、LINE、Teams、相機 App、其他 Chrome 分頁），再按下面的按鈕。'],
  OverconstrainedError: ['鏡頭不支援這個設定', '已改用鏡頭預設畫質重試；還是不行請換一支鏡頭或按 V 切換。'],
  unsupported: ['這個瀏覽器不能用鏡頭', '請用最新版 Chrome 或 Edge 開啟。'],
  NotSupportedError: ['這個視窗不允許使用鏡頭', '通常是在 Claude 的預覽視窗，或其他 App 內建的瀏覽器裡開啟。請把檔案下載到電腦，用 Chrome 透過 Live Server 開啟。']
};
function showCamHelp(key, detail) {
  const box = document.getElementById('camHelp');
  if (!key) { box.hidden = true; return; }
  const h = CAM_HELP[key] || ['鏡頭打不開', '錯誤代碼：' + key + '。請把這段訊息截圖給技術組。'];
  box.querySelector('b').textContent = h[0];
  box.querySelector('span').textContent = h[1] + (detail ? '（' + detail + '）' : '');
  box.hidden = false;
}
async function startCamera() {
  if (!window.isSecureContext && location.protocol !== 'file:') { pill('stCam', 'bad', '鏡頭：網址不安全'); showCamHelp('insecure', location.origin); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { pill('stCam', 'bad', '鏡頭：瀏覽器不支援'); showCamHelp(window.isSecureContext ? 'unsupported' : 'insecure'); return; }
  pill('stCam', 'warn', '鏡頭：啟動中');
  if (stream) stream.getTracks().forEach(t => t.stop());
  const devId = cams[camIdx] && cams[camIdx].deviceId;
  const tries = [
    Object.assign({ width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, devId ? { deviceId: { exact: devId } } : {}),
    devId ? { deviceId: { exact: devId } } : true,
    true
  ];
  let lastErr = null;
  for (const video_c of tries) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video_c });
      lastErr = null; break;
    } catch (e) {
      lastErr = e; console.warn('[Meta-Booth] 鏡頭嘗試失敗', video_c, e);
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break;   // 權限問題重試也沒用
    }
  }
  if (lastErr) {
    pill('stCam', 'bad', '鏡頭：無法開啟（' + lastErr.name + '）');
    showCamHelp(lastErr.name === 'SecurityError' ? 'insecure' : lastErr.name, lastErr.message);
    return;
  }
  try {
    video.srcObject = stream; await video.play();
    if (!video.videoWidth) await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    vAspect = (video.videoWidth || 16) / (video.videoHeight || 9);
    const all = await navigator.mediaDevices.enumerateDevices();
    cams = all.filter(d => d.kind === 'videoinput');
    const tr = stream.getVideoTracks()[0], set = tr.getSettings ? tr.getSettings() : {};
    tuneFocus(tr);
    camIdx = Math.max(0, cams.findIndex(c => c.deviceId === set.deviceId));
    pill('stCam', 'ok', '鏡頭：' + (tr.label || '鏡頭').slice(0, 24) + ' ' + video.videoWidth + '×' + video.videoHeight + (cams.length > 1 ? '（共 ' + cams.length + ' 支，按 V 切換）' : ''));
    showCamHelp(null);
  } catch (e) {
    pill('stCam', 'bad', '鏡頭：畫面播放失敗'); showCamHelp(e.name, e.message); console.error(e);
  }
}
async function initVision() {
  try {
    const vision = await import(MP_BASE + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
    const mk = async (Cls, opts, delegate) => Cls.createFromOptions(fileset, Object.assign({ runningMode: 'VIDEO' }, opts, { baseOptions: { modelAssetPath: opts.model, delegate } }));
    const make = async (delegate) => {
      pose = await mk(vision.PoseLandmarker, { model: POSE_MODEL, numPoses: 1 }, delegate);
      face = await mk(vision.FaceLandmarker, { model: FACE_MODEL, numFaces: 1, outputFaceBlendshapes: true }, delegate);
    };
    try { await make('GPU'); pill('stTrack', 'ok', '動補：運作中（GPU）'); }
    catch (e) { console.warn('GPU 失敗，改用 CPU', e); await make('CPU'); pill('stTrack', 'warn', '動補：運作中（CPU，較慢）'); }
  } catch (e) {
    console.error(e);
    pill('stTrack', 'bad', '動補：載入失敗，請檢查網路');
  }
}
let scanTick = 0, lastBadToast = 0;
function scanQR() {
  if (typeof jsQR !== 'function' || !video.videoWidth) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  // 輪流掃：(1) 中間掃描框區域，用原始解析度（小 QR、遠一點也掃得到） (2) 整個畫面縮成 960 寬
  let sx = 0, sy = 0, sw = vw, sh = vh, w, h;
  if (scanTick++ % 2 === 0) {
    sw = Math.round(vw * 0.5); sh = Math.round(vh * 0.8); sx = Math.round((vw - sw) / 2); sy = Math.round((vh - sh) / 2);
    w = sw; h = sh;
  } else { w = Math.min(960, vw); h = Math.round(w * vh / vw); }
  scanCanvas.width = w; scanCanvas.height = h;
  scanCtx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  const img = scanCtx.getImageData(0, 0, w, h);
  const code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
  if (code && code.data) {
    const S = decodePayload(code.data);
    if (S) loadAvatar(S);
    else if (performance.now() - lastBadToast > 3000) { lastBadToast = performance.now(); toast('這不是 Meta-Booth 的分身票'); }
  }
}
// 有支援的鏡頭打開連續自動對焦
function tuneFocus(track) {
  try {
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    const adv = {};
    if (cap.focusMode && cap.focusMode.includes('continuous')) adv.focusMode = 'continuous';
    if (cap.exposureMode && cap.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
    if (Object.keys(adv).length) track.applyConstraints({ advanced: [adv] }).catch(() => {});
  } catch (e) {}
}
const POSE_LINKS = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24]];
function drawSkeleton(poseLm, faceLm) {
  if (camwrap.hidden) return;
  const w = skel.width = skel.clientWidth * 1, h = skel.height = skel.clientHeight * 1;
  sctx.clearRect(0, 0, w, h);
  // object-fit: cover 換算
  const va = vAspect, ca = w / h; let sw = w, sh = h, ox = 0, oy = 0;
  if (va > ca) { sw = h * va; ox = (w - sw) / 2; } else { sh = w / va; oy = (h - sh) / 2; }
  const X = p => ox + p.x * sw, Y = p => oy + p.y * sh;
  if (poseLm) {
    sctx.strokeStyle = '#ffd23f'; sctx.lineWidth = 2;
    POSE_LINKS.forEach(([a, b]) => { sctx.beginPath(); sctx.moveTo(X(poseLm[a]), Y(poseLm[a])); sctx.lineTo(X(poseLm[b]), Y(poseLm[b])); sctx.stroke(); });
  }
  if (faceLm) { sctx.fillStyle = '#3ee0d0'; [33, 263, 1, 13, 14].forEach(i => { sctx.beginPath(); sctx.arc(X(faceLm[i]), Y(faceLm[i]), 2.5, 0, PI * 2); sctx.fill(); }); }
}

// ================= 主迴圈 =================
const clock = new T.Clock();
let fpsAcc = 0, fpsN = 0, fpsT = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(1 / pixelScale);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1.2 ? 42 : 30;
  camera.updateProjectionMatrix();
  frameCanvas.width = Math.round(w * dpr); frameCanvas.height = Math.round(h * dpr);
  drawOverlay();
}
window.addEventListener('resize', resize);

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, clock.getDelta()), t = clock.elapsedTime, now = performance.now();
  if (video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    if (state === 'idle') {
      if (now - lastScan > 150) { lastScan = now; scanQR(); }
    } else if (pose && face) {
      let pl = null, fl = null;
      try {
        const pr = pose.detectForVideo(video, now);
        if (pr.landmarks && pr.landmarks[0]) { pl = pr.landmarks[0]; onPose(pl, pr.worldLandmarks && pr.worldLandmarks[0], now); }
        const fr = face.detectForVideo(video, now);
        if (fr.faceLandmarks && fr.faceLandmarks[0]) { fl = fr.faceLandmarks[0]; onFace(fl, fr.faceBlendshapes && fr.faceBlendshapes[0] && fr.faceBlendshapes[0].categories, now); }
      } catch (e) { console.warn(e); }
      drawSkeleton(pl, fl);
    }
  }
  if (DEMO && rig) {
    // 示範動作：右手往前舉起揮手（手肘彎）、左手叉腰、右腳抬膝
    const a = Math.sin(t * 1.4) * 0.5 + 0.5, k2 = Math.max(0, Math.sin(t * 1.1));
    tgt.upperArm[1].set(0.5, -0.35 + a * 1.0, 0.65).normalize();
    tgt.foreArm[1].set(0.15 + Math.sin(t * 6) * 0.45, 1, 0.25).normalize();
    tgt.upperArm[-1].set(-0.8, -0.6, -0.15).normalize();
    tgt.foreArm[-1].set(0.75, -0.35, 0.35).normalize();
    tgt.thigh[1].set(0.05, -1, k2 * 1.5).normalize();
    tgt.shin[1].set(0, -1, -k2 * 0.15).normalize();
    tgt.thigh[-1].set(-0.04, -1, 0).normalize(); tgt.shin[-1].copy(DOWN);
    tgt.hy = Math.sin(t * 0.8) * 0.4; tgt.hr = Math.sin(t * 1.1) * 0.15; tgt.lean = Math.sin(t * 0.9) * 0.1; tgt.yaw = Math.sin(t * 0.5) * 0.3;
    tgt.blink['-1'] = tgt.blink['1'] = (t % 3) < 0.15 ? 1 : 0; tgt.jaw = Math.max(0, Math.sin(t * 3)) * 0.5;
  }
  applyRig(dt, t);
  shadow.visible = !!rig;
  deco.children.forEach(m => { m.rotation.x += dt * m.userData.spin; m.rotation.y += dt * m.userData.spin * 0.7; m.position.y += Math.sin(t + m.userData.phase) * 0.0015; });
  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++;
  if (now - fpsT > 1000) { document.getElementById('stFps').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; fpsT = now; }
}

// ================= 鍵盤 / 手動輸入 =================
const manual = document.getElementById('manual'), codeInput = document.getElementById('codeInput'), nameInput2 = document.getElementById('nameInput2'), codeErr = document.getElementById('codeErr');
function openManual() { manual.hidden = false; codeErr.hidden = true; codeInput.value = ''; nameInput2.value = ''; setTimeout(() => codeInput.focus(), 0); }
document.getElementById('manualCancel').addEventListener('click', () => { manual.hidden = true; });
document.getElementById('manualForm').addEventListener('submit', e => {
  e.preventDefault();
  const raw = codeInput.value.replace(/[^0-9a-zA-Z]/g, '');
  let id = 'HAND', p = raw;
  if (raw.length === 13) { id = raw.slice(0, 4).toUpperCase(); p = raw.slice(4); }
  const S = paramsToState(p.toLowerCase());
  if (!S) { codeErr.hidden = false; return; }
  S.id = id; S.name = nameInput2.value.trim();
  manual.hidden = true; loadAvatar(S);
});
window.addEventListener('keydown', e => {
  if (!manual.hidden) { if (e.key === 'Escape') manual.hidden = true; return; }
  const k = e.key;
  if (k === ' ' || k === 'Enter' || k === 'PageDown' || k === 'ArrowRight' || k === 'PageUp' || k === 'ArrowLeft') { e.preventDefault(); startCountdown(); }
  else if (k === 'n' || k === 'N' || k === 'Escape') unloadAvatar();
  else if (k === 'b' || k === 'B') { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); toast('背景：' + THEMES[themeIdx].name); }
  else if (k === 'k' || k === 'K') { calib = null; calibBuf = []; toast('頭部校正中，請正視螢幕'); }
  else if (k === 'd' || k === 'D') { showCamSmall = !showCamSmall; if (state !== 'idle') camwrap.hidden = !showCamSmall; }
  else if (k === 'c' || k === 'C') openManual();
  else if (k === 'v' || k === 'V') { if (cams.length > 1) { camIdx = (camIdx + 1) % cams.length; startCamera(); } else toast('只偵測到一支鏡頭'); }
  else if (k === 'p' || k === 'P') { pixelScale = pixelScale >= 4 ? 1 : pixelScale + 1; resize(); toast('像素顆粒：' + (pixelScale === 1 ? '關閉' : pixelScale + ' 倍')); }
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
});

// ================= 啟動 =================
window.metaBooth = { camera, get rig() { return rig; }, load: t => { const S = decodePayload(t); if (S) loadAvatar(S); return !!S; }, decode: decodePayload, capture: startCountdown };
resize(); applyTheme(); setState('idle'); loop();

// ---- 載入分身模型（metabooth_avatar.glb 放在這個網頁旁邊；也可以直接把 .glb 拖進視窗）
function modelLoaded(parts, label) {
  const miss = parts.pivots.length ? '（缺少軸心：' + parts.pivots.join('、') + '）' : '';
  toast('模型已載入：' + label + miss);
  console.log('[Meta-Booth] 模型零件', parts);
  if (current) loadAvatar(current);
}
if (window.AvatarLib && THREE.GLTFLoader) {
  AvatarLib.load('metabooth_avatar.glb').then(p => modelLoaded(p, 'metabooth_avatar.glb'))
    .catch(() => toast('讀不到 metabooth_avatar.glb，先用內建模型（可把 .glb 拖進來）'));
}
let dropEl = null;
window.addEventListener('dragover', e => { e.preventDefault(); if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'drop'; dropEl.textContent = '放開來載入模型 (.glb)'; document.body.appendChild(dropEl); } });
window.addEventListener('dragleave', e => { if (e.target === dropEl) { dropEl.remove(); dropEl = null; } });
window.addEventListener('drop', e => {
  e.preventDefault(); if (dropEl) { dropEl.remove(); dropEl = null; }
  const f = e.dataTransfer.files[0]; if (!f || !window.AvatarLib) return;
  f.arrayBuffer().then(buf => AvatarLib.load(buf)).then(p => modelLoaded(p, f.name)).catch(err => { console.error(err); toast('這個檔案讀不出來，請確認是 .glb'); });
});
if (DEMO) {
  pill('stCam', 'warn', '鏡頭：示範模式'); pill('stTrack', 'warn', '動補：示範動作');
  const S = paramsToState(params.get('demo') || '') || paramsToState('000001144');
  S.id = 'DEMO'; S.name = '示範分身';
  loadAvatar(S);
} else {
  document.getElementById('camRetry').addEventListener('click', () => { cams = []; camIdx = 0; startCamera(); });
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => { if (!stream || !stream.active) startCamera(); });
  startCamera(); initVision();
}
})();
</script>
